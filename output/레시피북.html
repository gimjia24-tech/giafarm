<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>레시피 북</title>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
body{margin:0;font-family:"WenQuanYi Zen Hei","Noto Sans CJK KR",sans-serif;color:#2b2b2b}
.card{width:210mm;height:148.5mm;padding:14mm 18mm;border-bottom:1px dashed #bbb;position:relative;overflow:hidden}
.card:last-child{border-bottom:none}
.no{font-size:11pt;color:#b5472f;letter-spacing:2px}
h1{margin:2mm 0 1mm;font-size:26pt;color:#8a2f1c}
.sub{font-size:11pt;color:#777;margin-bottom:6mm}
table{width:100%;border-collapse:collapse;font-size:15pt}
td{padding:2.6mm 1mm;border-bottom:1px solid #e6ddd5}
td.q{text-align:right;font-weight:bold;color:#8a2f1c;white-space:nowrap}
td small{color:#777;font-size:11pt}
</style></head><body>
<div class="card">
  <div class="no">RECIPE 01</div>
  <h1>불고기 양념</h1>
  <div class="sub">&nbsp;</div>
  <table>
    <tr><td>소금</td><td class="q">0.5T</td></tr>
    <tr><td>설탕</td><td class="q">2T</td></tr>
    <tr><td>참기름 <small>(4번 정도 두르기)</small></td><td class="q">2T</td></tr>
  </table>
</div>
<div class="card">
  <div class="no">RECIPE 02</div>
  <h1>오이 양념</h1>
  <div class="sub">오이 2개 · 양파 1개 기준</div>
  <table>
    <tr><td>고춧가루</td><td class="q">2T</td></tr>
    <tr><td>501 간장</td><td class="q">2T</td></tr>
    <tr><td>멸치액젓</td><td class="q">1T</td></tr>
    <tr><td>설탕</td><td class="q">1.5T</td></tr>
    <tr><td>마늘</td><td class="q">1T</td></tr>
    <tr><td>통깨</td><td class="q">1T</td></tr>
  </table>
</div>
</body></html>
